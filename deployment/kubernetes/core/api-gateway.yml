apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: magdalenajanicijevic/api-gateway:latest

          ports:
            - containerPort: 8080

          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server:8761/eureka/

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_SECRET

            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888

---

apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce

spec:
  selector:
    app: api-gateway

  ports:
    - port: 8080
      targetPort: 8080

  type: LoadBalancer