apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: review-service

  template:
    metadata:
      labels:
        app: review-service

    spec:
      containers:
        - name: review-service
          image: magdalenajanicijevic/review-service:latest

          ports:
            - containerPort: 8087

          env:
            - name: EUREKA_HOST
              value: discovery-server

            - name: DB_HOST
              value: postgres

            - name: DB_USERNAME
              value: postgres

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DB_PASSWORD

            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888

---

apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: ecommerce

spec:
  selector:
    app: review-service

  ports:
    - port: 8087
      targetPort: 8087

  type: ClusterIP