apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecommerce
spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: magdalenajanicijevic/user-service:latest

          ports:
            - containerPort: 8081

          env:
            - name: EUREKA_HOST
              value: discovery-server

            - name: DB_HOST
              value: postgres

            - name: DB_USERNAME
              value: postgres

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: JWT_SECRET

            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20

---

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ecommerce
spec:
  selector:
    app: user-service

  ports:
    - name: http
      port: 8081
      targetPort: 8081

  type: ClusterIP