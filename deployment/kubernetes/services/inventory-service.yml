apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: inventory-service

  template:
    metadata:
      labels:
        app: inventory-service

    spec:
      containers:
        - name: inventory-service
          image: magdalenajanicijevic/inventory-service:latest

          ports:
            - containerPort: 8083

          env:
            - name: EUREKA_HOST
              value: discovery-server

            - name: DB_HOST
              value: postgres

            - name: DB_USERNAME
              value: postgres

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DB_PASSWORD

            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20

---

apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ecommerce

spec:
  selector:
    app: inventory-service

  ports:
    - port: 8083
      targetPort: 8083

  type: ClusterIP