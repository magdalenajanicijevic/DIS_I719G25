apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: magdalenajanicijevic/notification-service:latest

          ports:
            - containerPort: 8086

          env:
            - name: EUREKA_HOST
              value: discovery-server

            - name: DB_HOST
              value: postgres

            - name: DB_USERNAME
              value: postgres

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DB_PASSWORD

            - name: RABBITMQ_HOST
              value: rabbitmq

            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: RABBITMQ_USERNAME

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: RABBITMQ_PASSWORD

            - name: SPRING_CONFIG_IMPORT
              value: optional:configserver:http://config-server:8888

---

apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce

spec:
  selector:
    app: notification-service

  ports:
    - port: 8086
      targetPort: 8086

  type: ClusterIP