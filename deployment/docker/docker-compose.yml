services:

  # POSTGRESQL

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # RABBITMQ

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # DISCOVERY SERVER - EUREKA

  discovery-server:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        SERVICE: discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      EUREKA_HOST: discovery-server
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network

  # CONFIG SERVER

  config-server:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        SERVICE: config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      EUREKA_HOST: discovery-server
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network

  # USER SERVICE

  user-service:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        SERVICE: user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      EUREKA_HOST: discovery-server
      DB_HOST: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # PRODUCT SERVICE

  product-service:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        SERVICE: product-service
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      EUREKA_HOST: discovery-server
      DB_HOST: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # INVENTORY SERVICE

  inventory-service:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        SERVICE: inventory-service
    container_name: inventory-service
    ports:
      - "8083:8083"
    environment:
      EUREKA_HOST: discovery-server
      DB_HOST: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # ORDER SERVICE

  order-service:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        SERVICE: order-service
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      EUREKA_HOST: discovery-server
      DB_HOST: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network

  # PAYMENT SERVICE

  payment-service:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        SERVICE: payment-service
    container_name: payment-service
    ports:
      - "8085:8085"
    environment:
      EUREKA_HOST: discovery-server
      DB_HOST: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network

  # NOTIFICATION SERVICE

  notification-service:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        SERVICE: notification-service
    container_name: notification-service
    ports:
      - "8086:8086"
    environment:
      EUREKA_HOST: discovery-server
      DB_HOST: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network

  # REVIEW SERVICE

  review-service:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        SERVICE: review-service
    container_name: review-service
    ports:
      - "8087:8087"
    environment:
      EUREKA_HOST: discovery-server
      DB_HOST: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

  # API GATEWAY

  api-gateway:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      args:
        SERVICE: api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_HOST: discovery-server
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - ecommerce-network

  # PROMETHEUS

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - user-service
      - product-service
      - inventory-service
      - order-service
      - payment-service
      - notification-service
      - review-service
      - api-gateway
    networks:
      - ecommerce-network

  # GRAFANA

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: ${GRAFANA_SMTP_USER}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_USER}
      GF_SMTP_FROM_NAME: "E-Commerce Microservices Monitoring"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ecommerce-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  ecommerce-network:
    driver: bridge
