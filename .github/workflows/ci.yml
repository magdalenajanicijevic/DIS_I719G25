name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  common-security:
    name: Build and Test Common Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        working-directory: common-security
        run: mvn clean test


  build-and-test:
    name: Build and Test - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - config-server
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service
          - review-service
          - api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Common Security
        if: |
          matrix.service == 'user-service' ||
          matrix.service == 'product-service' ||
          matrix.service == 'inventory-service' ||
          matrix.service == 'order-service' ||
          matrix.service == 'payment-service' ||
          matrix.service == 'notification-service' ||
          matrix.service == 'review-service' ||
          matrix.service == 'api-gateway'
        working-directory: common-security
        run: mvn clean install -DskipTests

      - name: Make Maven Wrapper executable
        working-directory: ${{ matrix.service }}
        run: chmod +x mvnw

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: ./mvnw clean test


  docker-build-and-push:
    name: Build and Push Docker Image - ${{ matrix.service }}
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - common-security
      - build-and-test

    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - config-server
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service
          - review-service
          - api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}


  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - docker-build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Kubernetes namespace
        shell: powershell
        run: |
          kubectl apply -f deployment/kubernetes/namespace.yml

      - name: Create Kubernetes secret
        shell: powershell
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          kubectl create secret generic ecommerce-secrets `
            --namespace ecommerce `
            --from-literal="DB_PASSWORD=$env:DB_PASSWORD" `
            --from-literal="JWT_SECRET=$env:JWT_SECRET" `
            --from-literal="RABBITMQ_USERNAME=$env:RABBITMQ_USERNAME" `
            --from-literal="RABBITMQ_PASSWORD=$env:RABBITMQ_PASSWORD" `
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply infrastructure
        shell: powershell
        run: |
          kubectl apply -f deployment/kubernetes/infrastructure/postgres.yml
          kubectl apply -f deployment/kubernetes/infrastructure/rabbitmq.yml

      - name: Apply core components
        shell: powershell
        run: |
          kubectl apply -f deployment/kubernetes/core

      - name: Apply business services
        shell: powershell
        run: |
          kubectl apply -f deployment/kubernetes/services

      - name: Update application images
        shell: powershell
        run: |
          kubectl set image deployment/discovery-server discovery-server=${{ secrets.DOCKERHUB_USERNAME }}/discovery-server:${{ github.sha }} -n ecommerce
          kubectl set image deployment/config-server config-server=${{ secrets.DOCKERHUB_USERNAME }}/config-server:${{ github.sha }} -n ecommerce
          kubectl set image deployment/api-gateway api-gateway=${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:${{ github.sha }} -n ecommerce

          kubectl set image deployment/user-service user-service=${{ secrets.DOCKERHUB_USERNAME }}/user-service:${{ github.sha }} -n ecommerce
          kubectl set image deployment/product-service product-service=${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }} -n ecommerce
          kubectl set image deployment/inventory-service inventory-service=${{ secrets.DOCKERHUB_USERNAME }}/inventory-service:${{ github.sha }} -n ecommerce
          kubectl set image deployment/order-service order-service=${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }} -n ecommerce
          kubectl set image deployment/payment-service payment-service=${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${{ github.sha }} -n ecommerce
          kubectl set image deployment/review-service review-service=${{ secrets.DOCKERHUB_USERNAME }}/review-service:${{ github.sha }} -n ecommerce
          kubectl set image deployment/notification-service notification-service=${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ github.sha }} -n ecommerce

      - name: Check deployment status
        shell: powershell
        run: |
          kubectl rollout status deployment/discovery-server -n ecommerce
          kubectl rollout status deployment/config-server -n ecommerce
          kubectl rollout status deployment/api-gateway -n ecommerce

          kubectl rollout status deployment/user-service -n ecommerce
          kubectl rollout status deployment/product-service -n ecommerce
          kubectl rollout status deployment/inventory-service -n ecommerce
          kubectl rollout status deployment/order-service -n ecommerce
          kubectl rollout status deployment/payment-service -n ecommerce
          kubectl rollout status deployment/review-service -n ecommerce
          kubectl rollout status deployment/notification-service -n ecommerce

      - name: Check Kubernetes pods
        shell: powershell
        run: |
          kubectl get pods -n ecommerce