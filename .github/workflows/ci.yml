name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  common-security:
    name: Build and Test Common Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        working-directory: common-security
        run: mvn clean test


  build-and-test:
    name: Build and Test - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - config-server
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service
          - review-service
          - api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Common Security
        if: |
          matrix.service == 'user-service' ||
          matrix.service == 'product-service' ||
          matrix.service == 'inventory-service' ||
          matrix.service == 'order-service' ||
          matrix.service == 'payment-service' ||
          matrix.service == 'notification-service' ||
          matrix.service == 'review-service' ||
          matrix.service == 'api-gateway'
        working-directory: common-security
        run: mvn clean install -DskipTests

      - name: Make Maven Wrapper executable
        working-directory: ${{ matrix.service }}
        run: chmod +x mvnw

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: ./mvnw clean test
        
  docker-build-and-push:
    name: Build and Push Docker Image - ${{ matrix.service }}
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - common-security
      - build-and-test

    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - config-server
          - user-service
          - product-service
          - inventory-service
          - order-service
          - payment-service
          - notification-service
          - review-service
          - api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}